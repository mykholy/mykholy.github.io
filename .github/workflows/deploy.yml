name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build bilingual article artwork and share previews
        run: python3 scripts/build_article_media.py
      - name: Install social preview encoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate JPEG preview cards
        run: python3 scripts/build_social_images.py
      - name: Generate mobile article thumbnails
        run: python3 scripts/build_article_smalls.py
      - name: Generate responsive WebP thumbnails
        run: python3 scripts/build_project_thumbs.py
      - name: Build canonical /en/ and /ar/ routes, share cards and sitemap
        run: python3 scripts/build_locale_seo.py
      - name: Keep generated article markup in repository source
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- blog index.html en ar sitemap.xml feed.xml assets; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog index.html en ar sitemap.xml feed.xml assets/portfolio-social.jpg assets/images/articles/*-share.jpg assets/images/*-thumb.webp assets/images/articles/*-small.webp
            git commit -m "Refresh localized articles, share previews and SEO metadata [skip ci]"
            git push origin HEAD:main
          else
            echo "Article markup already in sync."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
