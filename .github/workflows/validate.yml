name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/blog.js
          node --check assets/js/analytics-config.js
          node --check assets/js/analytics.js
      - name: Verify essential content and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("index.html").read_text(encoding="utf-8")
          css = Path("assets/css/site.css").read_text(encoding="utf-8")
          js = Path("assets/js/site.js").read_text(encoding="utf-8")
          essential = [
              "index.html",
              "assets/css/site.css",
              "assets/js/site.js",
              "assets/js/blog.js",
              "assets/css/blog.css",
              "blog/index.html",
              "blog/articles.json",
              "assets/js/analytics.js",
              "assets/js/analytics-config.js",
              "privacy.html",
              "docs/ANALYTICS.md",
              "assets/cv/Ahmed_Elkholy_Senior_Backend_Engineer_CV_2026.pdf",
          ]
          for filename in essential:
              file = Path(filename)
              assert file.is_file() and file.stat().st_size > 0, f"Missing file: {filename}"
          assert 'id="projectGrid"' in site
          assert 'id="heroCv"' in site
          assert 'id="ai"' in site
          assert 'href="privacy.html"' in site
          assert 'analytics-config.js' in site and 'analytics.js' in site
          analytics_config = Path("assets/js/analytics-config.js").read_text(encoding="utf-8")
          analytics_script = Path("assets/js/analytics.js").read_text(encoding="utf-8")
          assert 'ga4MeasurementId: "G-777MHCRRZZ"' in analytics_config
          assert 'clarityProjectId: "z1tp5tfopd"' in analytics_config
          assert site.count('name="google-site-verification"') == 1
          assert 'content="gGALLmLXcsQgPzB3QUhtmsG-rPC9-fKQ8ZGuegDaBTY"' in site.split('</head>', 1)[0]
          assert 'ae_portfolio_analytics_consent_v2' in analytics_script
          assert 'G-XFZZ8J7Q4F' not in analytics_config
          assert 'z1tgj7ku7n' not in analytics_config
          assert 'analytics-config.js?v=portfolio-ga-20261022' in site
          assert 'analytics.js?v=portfolio-ga-20261022' in site
          assert 'consentv2' in analytics_script
          assert 'if(!ga&&!cl)return' in analytics_script
          assert 'analytics_storage:"granted"' in analytics_script
          assert 'ad_storage:"denied"' in analytics_script
          assert '<lastmod>2026-10-23</lastmod>' in Path("sitemap.xml").read_text()
          import json
          from html.parser import HTMLParser
          articles = list(Path('blog').glob('*/index.html'))
          assert len(articles) == 50, f"Expected 50 articles, found {len(articles)}"
          index = Path("blog/index.html").read_text(encoding="utf-8")
          catalog = json.loads(Path("blog/articles.json").read_text(encoding="utf-8"))
          assert len(catalog) == 50
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          assert sitemap.count('<loc>') == 52
          assert 'href="/blog/"' in site
          assert 'id="blogFeatured"' in site
          for f in articles:
              page = f.read_text(encoding="utf-8")
              url = 'https://mykholy.github.io/' + str(f.parent).replace('\\', '/') + '/'
              assert f'<link rel="canonical" href="{url}">' in page, f
              assert '"@type":"BlogPosting"' in page, f
              assert f'/blog/{f.parent.name}/' in index, f
              assert url in sitemap, f
          assert 'blog_article_view' in analytics_script
          print("Validated 50 standalone blog articles, canonical URLs, markup and sitemap.")

          assert 'class="project-card static-project"' in site
          assert 'assets/css/site.css' in site and 'assets/js/site.js' in site
          assert 'classList.add("js")' not in site, "Content should stay visible if JS fails"
          assert 'function renderProjects()' in js
          assert 'prefers-reduced-motion' in css
          print("Site syntax, AI content, privacy-first analytics, fallback projects, assets and CV passed.")
          PY
