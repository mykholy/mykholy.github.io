name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/blog.js
          node --check assets/js/analytics.js
          node --check assets/js/analytics-config.js
      - name: Build all article hero images, hooks and metadata
        run: python3 scripts/build_article_media.py
      - name: Install social preview encoder
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate JPEG preview cards
        run: python3 scripts/build_social_images.py
      - name: Build canonical locale pages and schema
        run: python3 scripts/build_locale_seo.py
      - name: Check 200 bilingual topics, paths, critical links, SEO and accessibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          home = Path("index.html").read_text(encoding="utf-8")
          assert 'id="insights"' in home
          assert 'id="blogFeatured"' not in home
          assert 'classList.add("js")' not in home
          assert 'id="projectGrid"' in home
          assert 'id="heroCv"' in home
          assert 'assets/js/site.js' in home
          assert 'assets/js/analytics-config.js' in home
          assert Path("assets/cv/Ahmed_Elkholy_Senior_Backend_Engineer_CV_2026.pdf").stat().st_size > 0
          catalog = json.loads(Path("blog/articles.json").read_text(encoding="utf-8"))
          assert len(catalog) == 200
          assert len({x["slug"] for x in catalog}) == 200
          en = Path("blog/index.html").read_text(encoding="utf-8")
          ar = Path("blog/ar/index.html").read_text(encoding="utf-8")
          assert en.count('class="blogcard') == 200
          assert ar.count('class="blogcard') == 200
          assert en.count('class="feature-story') == 6
          assert en.count('class="editorial-thumb"') >= 200
          assert ar.count('class="editorial-thumb"') >= 200
          assert ar.count('class="feature-story') == 6
          for item in catalog:
            for locale in ('en', 'ar'):
              seo = (Path(locale)/'blog'/item['slug']/'index.html').read_text(encoding='utf-8')
              assert f'href="https://mykholy.github.io/{locale}/blog/{item["slug"]}/"' in seo
              assert '<nav class="article-share"' in seo and 'property="og:image"' in seo
              assert 'Transparency: this AI-assisted article' not in seo
            slug = item["slug"]
            for path in (Path("blog")/slug/"index.html", Path("blog/ar")/slug/"index.html"):
              assert path.is_file() and path.stat().st_size > 1500, path
              html = path.read_text(encoding="utf-8")
              assert '<h1>' in html and 'rel="canonical"' in html, path
              assert 'class="article-hero-visual"' in html and 'class="article-hook"' in html, path
              assert 'property="og:image"' in html and '/assets/images/articles/' in html, path
            if item.get("status") == "review":
              assert 'content="noindex,follow"' in (Path("blog")/slug/"index.html").read_text(), slug
          for slug in ["clinics-voice-ai-receptionist","saas-businesses-knowledge-grounded-assistants","saas-businesses-workflow-approvals"]:
            assert 'content="index,follow"' in (Path("blog")/slug/"index.html").read_text()
            assert 'content="index,follow"' in (Path("blog/ar")/slug/"index.html").read_text()
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          ET.fromstring(sitemap)
          assert sitemap.count('<loc>') == 111
          for f in ("feed.xml","blog/ar/feed.xml"): ET.fromstring(Path(f).read_text(encoding="utf-8"))
          assert 'href="/feed.xml"' in home
          assert home.count('class="home-insight-image"') == 6
          assert len(list(Path('assets/images/articles').glob('*-hero.webp'))) == 27
          assert len(list(Path('assets/images/articles').glob('*-thumb.webp'))) == 27
          for path in ("assets/css/site.css","assets/css/blog.css","assets/js/blog.js","assets/js/site.js","assets/js/analytics.js","privacy.html","docs/ANALYTICS.md"):
            assert Path(path).stat().st_size > 0
          assert Path('en/feed.xml').is_file() and Path('ar/feed.xml').is_file()
          assert ET.fromstring(Path('en/feed.xml').read_text()).tag == 'rss'
          assert ET.fromstring(Path('ar/feed.xml').read_text()).tag == 'rss'
          assert Path('assets/portfolio-social.jpg').stat().st_size > 1024
          assert len(list(Path('assets/images/articles').glob('*-share.jpg'))) == 27
          assert Path('en/index.html').is_file() and Path('ar/index.html').is_file()
          assert Path('en/blog/index.html').is_file() and Path('ar/blog/index.html').is_file()
          print("400 canonical article routes, social shares, localized profiles, hreflang, feeds, sitemap and fallback passed.")
          PY
