name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/js/site.js
      - name: Verify essential content and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path("index.html").read_text(encoding="utf-8")
          css = Path("assets/css/site.css").read_text(encoding="utf-8")
          js = Path("assets/js/site.js").read_text(encoding="utf-8")
          essential = [
              "index.html",
              "assets/css/site.css",
              "assets/js/site.js",
              "assets/cv/Ahmed_Elkholy_Senior_Backend_Engineer_CV_2026.pdf",
          ]
          for filename in essential:
              file = Path(filename)
              assert file.is_file() and file.stat().st_size > 0, f"Missing file: {filename}"
          assert 'id="projectGrid"' in site
          assert 'id="heroCv"' in site
          assert 'assets/css/site.css' in site and 'assets/js/site.js' in site
          assert 'classList.add("js")' not in site, "Content should stay visible if JS fails"
          assert 'function renderProjects()' in js
          assert 'prefers-reduced-motion' in css
          print("Site syntax, fallback visibility, key content, and CV checks passed.")
          PY
